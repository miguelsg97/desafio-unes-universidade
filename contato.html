<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/x-icon" href="./imagens/icon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Contato | UNES</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li class="logo"><a href="index.html"><img src="./imagens/logo.png" alt="UNES Universidade"></a></li>
                <li><a href="index.html">Home</a></li>
                <li><a href="quemsomos.html">Sobre</a></li>
                <li><a href="contato.html" class="pagina-atual">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="banner-section banner-interno">
            <span>FALE CONOSCO</span>
            <h1>Entre em contato com a UNES</h1>
        </section>
        <section>
            <div class="contato-grid">
                <div class="form-coluna">
                    <h2 class="h2-titulo">Envie sua mensagem</h2>
                    <form id="form-contato">
                        <label for="email">Seu e-mail</label>
                        <input type="email" id="email" name="email" placeholder="voce@email.com">
                        <label for="assunto">Assunto</label>
                        <input type="text" id="assunto" name="assunto" placeholder="Assunto da mensagem">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao" name="descricao" placeholder="Escreva sua mensagem aqui..."></textarea>
                        <button type="submit" class="banner-section-button" id="form-button">Enviar</button>                      
                    </form>
                </div>
                <div class="canais-coluna">
                    <h2 class="h2-titulo">Outros canais</h2>
                    <ul class="lista-canais">
                        <li>
                            <div class="icone-canal"></div>
                            <div>
                                <h3>E-mail</h3>
                                <p class="p-canais">contato@unes.edu.br</p>
                            </div>
                        </li>
                        <li>
                            <div class="icone-canal"></div>
                            <div>
                                <h3>Telefone</h3>
                                <p class="p-canais">(00) 0000-0000</p>
                            </div>
                        </li>
                        <li>
                            <div class="icone-canal"></div>
                            <div>
                                <h3>Endereço</h3>
                                <p class="p-canais">Campus UNES, Bloco Central</p>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p class="copyright">ⓒ 2026 UNES Universidade — Todos os direitos reservados</p>
    </footer>
    <script>
        const formulario = document.getElementById("form-contato");
        formulario.addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Mensagem enviada!");
        });
    </script>  
</body>
</html>
